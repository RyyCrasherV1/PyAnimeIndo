name: Build PyAnimeIndo (All OS) + Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pyinstaller --onefile --windowed pyanimeindo.py
          else
            pyinstaller --onefile pyanimeindo.py
          fi

      - name: Rename output
        shell: bash
        run: |
          mkdir release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/*.exe release/PyAnimeIndo-Windows.exe
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/* release/PyAnimeIndo-Linux
          else
            mv dist/* release/PyAnimeIndo-macOS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAnimeIndo-${{ runner.os }}
          path: release/*
  
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
